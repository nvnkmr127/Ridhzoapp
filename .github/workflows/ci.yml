name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the secret scan covers past commits too
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Secrets must never land in git (history included). Fails the build on a finding.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Known-vulnerable production dependencies. Reported on every run; promote to a hard gate (remove
      # continue-on-error) once the current backlog is cleared.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      # The real correctness gates. Build is skipped here because it needs a live DB/Redis;
      # run it in a deploy job with those services provisioned.
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx next lint
      - name: Unit tests
        run: npx vitest run

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Catches a migration that only works on a database that already has older rows/columns.
      - name: Apply every migration to an empty database
        run: npx drizzle-kit migrate
      # Real-database checks that a WHERE clause really isolates tenants (unit tests mock the DB).
      - name: Tenant isolation + sync integration tests
        run: npx vitest run src/test/tenantIsolation.integration.test.ts src/app/api/v1/leads/sync.integration.test.ts
        env:
          SYNC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
      - name: Production build
        run: npx next build
        env:
          NEXTAUTH_SECRET: ci-build-secret
          NEXTAUTH_URL: http://localhost:3000

