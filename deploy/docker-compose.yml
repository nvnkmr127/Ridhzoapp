# Self-hosted stack: Postgres + Redis + the BullMQ worker.
#
# Copy deploy/.env.example -> deploy/.env on the droplet and fill in real secrets, then:
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
#
# SECURITY: Postgres and Redis are bound to 127.0.0.1 by default and are NOT meant to be reachable from
# the internet (passwords alone, no TLS, is not a safe public posture). To let a remote web tier reach
# them, do one of: (a) a private network / VPN / Tailscale, or (b) set DB_BIND / REDIS_BIND to a private
# interface IP AND terminate TLS in front (stunnel / Postgres ssl=on with certs; rediss://) AND allow-list
# the web tier's IPs in the host firewall. Production on Railway uses its own managed services instead.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # requirepass so an exposed 6379 isn't an open door. BullMQ needs keyspace eviction OFF
    # (noeviction) — never let Redis drop job keys under memory pressure.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Worker talks to the sibling containers by service name (internal network).
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NODE_ENV: production
      # Add any feature secrets the workers actually use (mailer, enrichment API keys, etc.)
      # here or via --env-file. Missing OPTIONAL vars just disable that feature.

volumes:
  pgdata:
  redisdata:
